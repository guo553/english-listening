<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>听力小工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- 页面容器：每个页面由独立的 div 承载，通过 active class 切换显示 -->
  <div id="app">
    <div id="page-home" class="page active"></div>    <!-- 主页：二维码上传、URL 输入 -->
    <div id="page-ready" class="page"></div>           <!-- 准备页：开始听力前显示套题信息 -->
    <div id="page-quiz" class="page"></div>            <!-- 答题页：音频播放、选择题作答 -->
    <div id="page-result" class="page"></div>          <!-- 结果页：批改结果、答案详情 -->
    <div id="page-settings" class="page"></div>        <!-- 设置页：延迟、跳过、缩放、主题 -->
    <div id="page-history" class="page"></div>         <!-- 历史页：所有练习记录 -->
  </div>

  <!-- 密码输入对话框：自动批改时弹出，由 CSS class hidden 控制显示/隐藏 -->
  <div id="password-dialog" class="dialog-overlay hidden">
    <div class="dialog-box">
      <div class="dialog-title">输入答案密码</div>
      <div class="dialog-desc">请输入发布者提供的密码以获取标准答案</div>
      <input type="password" id="pwd-input" class="input" placeholder="请输入密码" style="flex:1;">
      <button class="btn btn-secondary btn-small" id="pwd-paste" title="粘贴" style="flex-shrink:0;">📋 粘贴</button>
      <div class="dialog-actions">
        <button class="btn btn-secondary" id="pwd-cancel">取消</button>
        <button class="btn btn-primary" id="pwd-confirm">确认批改</button>
      </div>
      <div id="pwd-error" class="text-secondary mt-8" style="color: var(--error); display: none;"></div>
    </div>
  </div>

  <!-- Toast 提示：短暂显示操作结果 -->
  <div id="toast" class="toast"></div>

  <!--
    ===== JavaScript 加载说明 =====
    加载顺序严格按依赖关系排列，必须保持此顺序：

    块 1：第三方库（通过 CDN 或 node_modules 加载，作为全局变量注入）
    ───────────────────────────────────────────
    jsQR      → 全局 window.jsQR（二维码像素级解码）
    marked    → 全局 window.marked（markdown → HTML）
    DOMPurify → 全局 window.DOMPurify（HTML 安全过滤，防 XSS）

    块 2：本地工具库（定义全局函数，被 lib/ 内部互相调用）
    ───────────────────────────────────────────
    parser.js   → parsePageFromUrl / extractXxx 系列（从页面提取 markdown、音频、标题、年级）
    qrcode.js   → decodeQRFromFile / decodeQRFromBase64（调用 jsQR 解码）
    md-parser.js → parseQuestions（将提取的 markdown 解析为 {questions, sections, groups}）

    块 3：应用核心（依赖块 1 的全局变量和块 2 的解析函数）
    ───────────────────────────────────────────
    app.js      → 定义 App 全局对象（init / navigate / toast / initPasswordDialog / renderMarkdown）
                  注册 DOMContentLoaded 事件启动 App.init()

    块 4：页面渲染脚本（定义 window.page_{name} 函数，由 App.navigate 按需调用）
    ───────────────────────────────────────────
    home.js     → page_home   主页（二维码上传、URL 输入、历史摘要）
    ready.js    → page_ready  准备页（显示套题信息，点击开始跳到 quiz）
    quiz.js     → page_quiz   答题页（音频播放、选项选择、提交答案）
    result.js   → page_result 结果页（批改结果、答案详情、成绩趋势、CSV 导出）
    settings.js → page_settings 设置页（延迟、跳过、缩放、字体、主题、清除数据）
    history.js  → page_history 历史页（所有套题的练习记录、详情展开、删除、导出全部）

    注意：所有脚本都是同步加载（非 async/defer），确保执行顺序。
    DOMContentLoaded 事件在所有脚本执行完毕后触发，此时 App.init() 才会运行。
  -->
  <script src="../node_modules/jsqr/dist/jsQR.js"></script>
  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.js"></script>

  <script src="lib/parser.js"></script>
  <script src="lib/qrcode.js"></script>
  <script src="lib/md-parser.js"></script>

  <script src="app.js"></script>

  <script src="pages/home.js"></script>
  <script src="pages/ready.js"></script>
  <script src="pages/quiz.js"></script>
  <script src="pages/result.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/history.js"></script>
</body>
</html>
