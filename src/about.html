<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  display: flex; flex-direction: column; align-items: center;
  padding: 32px 24px 24px; text-align: center;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s, color 0.3s;
}

:root, [data-theme="light"] {
  --about-bg: #f5f5f7;
  --about-text: #1d1d1f;
  --about-text-secondary: #6e6e73;
  --about-link: #0071e3;
  --about-btn-bg: #e8e8ed;
  --about-btn-hover: #d2d2d7;
  --about-footer: #aeaeb2;
}

[data-theme="dark"] {
  --about-bg: #1c1c1e;
  --about-text: #f5f5f7;
  --about-text-secondary: #98989d;
  --about-link: #0a84ff;
  --about-btn-bg: #2c2c2e;
  --about-btn-hover: #3a3a3c;
  --about-footer: #636366;
}

@media (prefers-color-scheme: dark) {
  [data-theme="auto"] {
    --about-bg: #1c1c1e;
    --about-text: #f5f5f7;
    --about-text-secondary: #98989d;
    --about-link: #0a84ff;
    --about-btn-bg: #2c2c2e;
    --about-btn-hover: #3a3a3c;
    --about-footer: #636366;
  }
}

@media (prefers-color-scheme: light) {
  [data-theme="auto"] {
    --about-bg: #f5f5f7;
    --about-text: #1d1d1f;
    --about-text-secondary: #6e6e73;
    --about-link: #0071e3;
    --about-btn-bg: #e8e8ed;
    --about-btn-hover: #d2d2d7;
    --about-footer: #aeaeb2;
  }
}

body { background: var(--about-bg); color: var(--about-text); }
.avatar {
  width: 80px; height: 80px; border-radius: 50%;
  object-fit: cover; margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}
h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
.version { font-size: 13px; color: var(--about-text-secondary); margin-bottom: 16px; }
.info { font-size: 13px; line-height: 1.8; color: var(--about-text); }
.info a { color: var(--about-link); text-decoration: none; cursor: pointer; }
.info a:hover { text-decoration: underline; }
.btn-row { margin-top: 20px; display: flex; gap: 8px; justify-content: center; }
.btn {
  display: inline-flex; align-items: center; padding: 6px 16px;
  border: none; border-radius: 6px; font-size: 13px; cursor: pointer;
  font-family: inherit; background: var(--about-btn-bg); color: var(--about-text);
}
.btn:hover { background: var(--about-btn-hover); }
.footer { margin-top: 20px; font-size: 11px; color: var(--about-footer); }
</style>
</head>
<body>
<img class="avatar" src="icon.png" alt="图标">
<h1>English Listening Tool</h1>
<div class="version" id="version-text">v0.1.0 · MIT 许可</div>
<div class="info">
  作者: 郭皓玮<br>
  邮箱: guohaowei63@gmail.com<br>
  GitHub: <a id="link-github">guo553/english-listening</a><br>
  鸣谢: <a id="link-electron">Electron 框架</a>
</div>
<div class="btn-row">
  <button class="btn" id="btn-license">查看许可</button>
  <button class="btn" id="btn-ok">确定</button>
</div>
<div class="footer">本软件基于 MIT 协议开源，可自由使用、修改和分发。</div>
<script>
  const theme = localStorage.getItem('theme') || 'auto'
  document.documentElement.setAttribute('data-theme', theme)

  document.getElementById('btn-license').addEventListener('click', () => {
    window.open('./license.html', '_blank', 'width=700,height=600')
  })
  const params = new URLSearchParams(window.location.search)
  const v = params.get('v')
  if (v) document.getElementById('version-text').textContent = 'v' + v + ' · MIT 许可'
  document.getElementById('btn-ok').addEventListener('click', () => { window.close() })
  document.getElementById('link-github').addEventListener('click', () => {
    window.open('https://github.com/guo553/english-listening', '_blank')
  })
  document.getElementById('link-electron').addEventListener('click', () => {
    window.open('https://www.electronjs.org', '_blank')
  })
</script>
</body>
</html>
